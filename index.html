<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="screen-orientation" content="landscape" />
  <title>智慧車遠端控制</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
  <script src="./dht11.js" defer></script>
  <script src="./bh1750.js" defer></script>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span>📶 Wi-Fi 192.168.1.100</span>
      <span class="dot-online" id="connection-dot"></span>
      <span class="status-label" id="connection-status">連線中</span>
    </div>
    <div class="topbar-center">智慧車遠端控制</div>
    <div class="topbar-right">
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Left: camera control -->
    <div class="panel-left">
      <div class="panel-title">鏡頭方向控制</div>

      <div class="cam-grid">
        <div class="cam-spacer"></div>
        <button class="cam-btn" id="btn-cam-up"
          data-camera-direction="up"
	  <span class="arrow">↑</span>
          <span>上</span>
        </button>
        <div class="cam-spacer"></div>

        <button class="cam-btn" id="btn-cam-left"
          data-camera-direction="left"
	  <span class="arrow">←</span>
          <span>左</span>
        </button>
        <div class="cam-spacer"></div>
        <button class="cam-btn" id="btn-cam-right"
          data-camera-direction="right"
	  <span class="arrow">→</span>
          <span>右</span>
        </button>

        <div class="cam-spacer"></div>
        <button class="cam-btn" id="btn-cam-down"
          data-camera-direction="down"
	  <span class="arrow">↓</span>
          <span>下</span>
        </button>
        <div class="cam-spacer"></div>
      </div>
    </div>
    

    <!-- Center: video feed -->
    <div class="panel-center">
      <div class="video-placeholder"></div>
      <img src="/stream">
      <div class="video-overlay">
       <!-- <div class="badge-rec"><span class="rec-dot"></span>REC</div>
        <div class="badge-fps">FPS: 30</div>
        <div class="badge-res">分辨率: 640×480</div>
	<div class="badge-latency">延遲: 120 ms</div> -->
      </div>
    </div>

    <!-- Right: joystick -->
    <div class="panel-right">
      <div class="panel-title">移動控制</div>
      <div class="joystick-wrap">
        <div class="joystick-ring" id="joystick-ring">
          <span class="d-arrow up">↑</span>
          <span class="d-arrow left">←</span>
          <span class="d-arrow right">→</span>
          <span class="d-arrow down">↓</span>
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div class="bottombar">
    <div class="sensor-item">
      <span class="sensor-icon">🌡️</span>
      <span class="sensor-label">溫度: <span id="temp">24.5°C</span></span>
    </div>
    <div class="sensor-item">
      <span class="sensor-icon">💧</span>
      <span class="sensor-label">濕度: <span id="humi">55%</span></span>
    </div>
    <div class="sensor-item">
  <span class="sensor-icon">🌫️</span>
  <span class="sensor-label">
    空氣品質：
    <span id="air-quality" class="air-quality unknown">
      等待資料
    </span>
  </span>
</div>
    <div class="sensor-item">
      <span class="sensor-icon">☀️</span>
      <span class="sensor-label">光照值: <span id="lux">850 lux</span></span>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js');
  }
</script>
</body>
</html>
